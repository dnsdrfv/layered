<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>LAYERED — гардероб-коллаж</title>
<meta name="description" content="Фотографируй вещи, вырезай фон и собирай образы на манекене по слоям.">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="g-body" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#DFDBD4"/><stop offset="0.5" stop-color="#EEEBE6"/><stop offset="1" stop-color="#D9D4CC"/></linearGradient>
    <symbol id="mannequin" viewBox="0 0 240 440">
      <ellipse cx="120" cy="433" rx="74" ry="6" fill="rgba(0,0,0,0.08)"/>
      <g stroke="#DAD6CF" stroke-width="15" stroke-linecap="round" fill="none"><path d="M76 98 L54 226"/><path d="M164 98 L186 226"/></g>
      <g fill="url(#g-body)">
        <ellipse cx="120" cy="42" rx="24" ry="28"/>
        <rect x="110" y="64" width="20" height="26" rx="6"/>
        <path d="M72 92 Q120 80 168 92 L164 240 L76 240 Z"/>
        <path d="M80 238 L160 238 L156 418 L126 418 L120 280 L114 418 L84 418 Z"/>
      </g>
    </symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="9" rx="1"/><rect x="13.5" y="3" width="7.5" height="6" rx="1"/><rect x="3" y="15" width="7.5" height="6" rx="1"/><rect x="13.5" y="12" width="7.5" height="9" rx="1"/></g></symbol>
    <symbol id="i-hanger" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5.5a2 2 0 1 1 2 2c-.6 0-1 .5-1 1V9"/><path d="M11 9 3 16c-.6.5-.3 1.5.5 1.5h17c.8 0 1.1-1 .5-1.5z"/></g></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-scissors" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.6 7.6 20 18M8.6 16.4 20 6"/></g></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-heart-fill" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" fill="currentColor"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>

    <symbol id="i-camera" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h3l1.5-2.5h6L16.5 7h3A1.5 1.5 0 0 1 21 8.5v10a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/><circle cx="12" cy="13" r="3.8"/></g></symbol>
    <symbol id="i-gallery" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="m3 17 5-5 4 4 3-3 6 6"/></g></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></g></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></g></symbol>
    <symbol id="i-drag" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 6h.01M16 6h.01M8 12h.01M16 12h.01M8 18h.01M16 18h.01"/></g></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M8 8l4-4 4 4"/><path d="M5 13v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6"/></g></symbol>
  </defs>
</svg>

<main id="app" class="app" aria-live="polite"></main>

<nav class="tabbar" id="tabbar" aria-label="Разделы">
  <a href="#home" data-tab="home" class="tab"><svg><use href="#i-grid"/></svg>Образы</a>
  <a href="#wardrobe" data-tab="wardrobe" class="tab"><svg><use href="#i-hanger"/></svg>Гардероб</a>
  <a href="#add" data-tab="add" class="tab tab-add" aria-label="Добавить вещь"><span><svg><use href="#i-plus"/></svg></span></a>
  <a href="#editor" data-tab="editor" class="tab"><svg><use href="#i-scissors"/></svg>Коллаж</a>
</nav>

<div id="toast" class="toast" role="status" hidden></div>
<input type="file" id="file-camera" accept="image/*" capture="environment" hidden>
<input type="file" id="file-gallery" accept="image/*" hidden>

<script type="module" src="app.js"></script>
</body>
</html>
